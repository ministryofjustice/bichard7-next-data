name: Build data jar

on:
  workflow_dispatch:
  push:

jobs:
  test:
    name: Build data jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          fetch-depth: 0

      - name: Package data with Maven into a jar file
        run: mvn package --no-transfer-progress